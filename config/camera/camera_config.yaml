# 相机参数配置
cameras:
  eye:
    id: "192.168.2.10"
    type: "berxel"
    enabled: true
    param_in_file: true
    send_chassis_depth: false
    expos_us: 1000
    expos_gain: 100
    pointcloud_type: 1  # 0: 无需点云, 1: 普通点云, 2: 彩色点云
    qos: "best_effort"
    width: 640  # 可选: "640x400" 或 "1280x800"
    height: 400
    
