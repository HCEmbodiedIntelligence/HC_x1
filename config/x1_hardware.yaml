control:
  command_smoothing:
    node_name: hc_x1_joint_command_smoother
    input_topic: /action/joint_states
    feedback_topic: /io_teleop/joint_states
    output_topic: /io_teleop/joint_cmd
    hardware_ready_topic: /io_teleop/hardware_ready
    rate_hz: 100.0
    time_constant: 0.04
    max_velocity: 2.5
    max_acceleration: 12.0
    deadband: 0.00015
    input_timeout: 0.15
    feedback_timeout: 0.5
    feedback_resync_threshold: 0.5
    publisher_conflict_check_period: 0.5
    allowed_idle_output_publishers:
      - robot_control_pid_node
    conflict_activity_topic: /io_teleop/sol_q
    conflict_activity_timeout: 0.25
